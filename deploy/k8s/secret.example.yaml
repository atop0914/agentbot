# Secret 样例 —— 这个文件里没有真实值，也不应该被提交真实值。
#
# 两种创建方式，选一种：
#
# A) 命令行（推荐，值不落盘）：
#      kubectl create secret generic agentbot-secrets -n agentbot \
#        --from-literal=AGENTBOT_AUTH_JWT_SECRET="$(openssl rand -base64 48)" \
#        --from-literal=AGENTBOT_DATABASE_PASSWORD="$(openssl rand -base64 24)"
#
# B) 外部密钥管理（生产推荐）：用 External Secrets / Sealed Secrets /
#    SOPS 把密文纳入 Git，由控制器同步成 Secret。这样轮转与审计
#    有单一来源，也不会出现「谁能 kubectl get secret」= 「谁能拿到密钥」。
#
# 若确实要用 YAML 直接创建，把下面 stringData 的值改成
# `kubectl create secret ... --dry-run=client -o yaml` 的输出，**不要**
# 手写明文进 Git。
apiVersion: v1
kind: Secret
metadata:
  name: agentbot-secrets
  namespace: agentbot
  labels:
    app.kubernetes.io/name: agentbot
type: Opaque
stringData:
  # 至少 32 字节随机值。程序会在启动时校验长度与占位符特征。
  AGENTBOT_AUTH_JWT_SECRET: "REPLACE_WITH_OPENSSL_RAND_BASE64_48"
  AGENTBOT_DATABASE_PASSWORD: "REPLACE_WITH_OPENSSL_RAND_BASE64_24"
  # 仅在启用企业 SSO 时提供；留空则所有 SSO 入口返回 503（默认拒绝）。
  AGENTBOT_SSO_CLIENT_SECRET: ""
