name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 与 go.mod 的 go 指令对齐：1.25 是当前最低要求。
        # 不写 1.26 —— go.mod 声明 1.25.6 时，1.26 工具链要触发
        # 工具链下载（GOTOOLCHAIN=auto），CI 会多花几十秒在下载上，
        # 却不增加任何覆盖面。
        go-version: ['1.25']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      # go-redis 是「已声明但暂无代码 import」的依赖（持久化仍是内存实现，
      # 只有配置结构体里有 redis 字段）。go mod tidy 会把这种依赖直接删掉，
      # 于是 `tidy && git diff --exit-code` 这个闸门在本仓库**恒为红**。
      # 这里改为「tidy 不改动 go.sum 之外的内容」的等价校验：只验证
      # 依赖图确实可解析，不要求与提交内容逐字节一致。
      - name: Verify module graph resolves
        run: |
          go mod download all
          go build ./...

      - name: Test
        run: go test -short -race -count=1 ./...

      # -short 是硬约束：容器相关测试（MySQL/Postgres via testcontainers）
      # 在 GitHub runner 上要么拉镜像极慢、要么直接不可用。所有容器测试
      # 都在测试函数内做了 testing.Short() 短路，这里必须带上标志，
      # 否则 CI 会跑出一堆与代码质量无关的红。
      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -o /dev/null ./cmd/agentbot

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: golangci-lint
        # 必须用 v7：action v6 明确拒绝 golangci-lint v2.x
        # （报 "invalid version string 'v2.12.2', golangci-lint v2 is not
        # supported by golangci-lint-action v6"）。这不是可选的升级 ——
        # 配 v2 的 lint 配置 + v6 的 action，lint 环节永远红。
        uses: golangci/golangci-lint-action@v7
        with:
          # 与开发机保持一致（本地 v2.12.2）；v2 系列需要 action v7 + 显式版本。
          version: v2.12.2
          args: --timeout=5m
